name: Transporte Publico — CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── JOB 1: TESTS ──────────────────────────────────────────
  test:
    name: Run Django Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: llumiquinga_transporte_db
          POSTGRES_USER: llumiquinga_transporte_user
          POSTGRES_PASSWORD: shopapi_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        env:
          SECRET_KEY: test-key-not-for-production
          DEBUG: True
          DB_NAME: llumiquinga_transporte_db
          DB_USER: llumiquinga_transporte_user
          DB_PASSWORD: shopapi_pass
          DB_HOST: localhost
          DB_PORT: 5432
          TEST_DB_NAME: llumiquinga_transporte_db
          CORS_ALLOW_ALL_ORIGINS: True
          ALLOWED_HOSTS: "*"
        run: uv run python manage.py test transporte --verbosity=2 --noinput

  # ── JOB 2: DEPLOY ─────────────────────────────────────────
  deploy:
    name: Deploy to DigitalOcean Droplet
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Droplet via SSH Action
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPSSSHKEY }}
          script_stop: true # Detiene el pipeline inmediatamente si un comando falla
          script: |
            # 1. Asegurar ejecutables de uv en la sesión SSH
            export PATH="/root/.local/bin:$PATH"

            echo "── 1. Actualizando código desde GitHub ──"
            cd /opt/proyecto_-gestion_de_transporte_publico
            git fetch origin
            git reset --hard origin/main

            echo "── 2. Sincronizando dependencias con uv ──"
            uv sync --frozen

            echo "── 3. Aplicando migraciones de Base de Datos ──"
            uv run python manage.py migrate --noinput

            echo "── 4. Recolectando archivos estáticos ──"
            uv run python manage.py collectstatic --noinput --clear

            echo "── 5. Reiniciando Gunicorn y Nginx ──"
            systemctl restart gunicorn-llumiquinga_transporte
            systemctl restart nginx

            echo "── 6. Verificando estado del servicio ──"
            sleep 6
            systemctl is-active gunicorn-llumiquinga_transporte
            
            echo "¡Despliegue automático completado con éxito total!"
            